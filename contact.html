<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fale Conosco | Ford Ranger 2022</title>
    <meta
      name="description"
      content="Entre em contato com a Ford sobre a Ranger 2022: elogios, reclamações ou solicitações através do nosso formulário."
    />
    <link rel="icon" type="image/png" href="img/ford-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="cabecalho">
      <a href="index.html" class="cabecalho__logo">
        <img
          src="img/logo-ford-256.png"
          class="cabecalho__logo__ford"
          alt="Ford"
        />
      </a>
      <input type="checkbox" id="menu-hamburguer" />
      <label for="menu-hamburguer" class="cabecalho__menu__hamburguer">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav class="cabecalho__menu" id="menu-navegacao">
        <a href="index.html" class="cabecalho__menu__link">HOME</a>
        <a href="launch.html" class="cabecalho__menu__link">LANÇAMENTO</a>
        <a href="contact.html" class="cabecalho__menu__link" aria-current="page">CONTATO</a>
      </nav>
    </header>
    <main class="pagina">
      <section class="contato" aria-labelledby="contato-titulo">
        <div class="contato__imagem">
          <img
            src="img/storm.jpg"
            alt="Ford Ranger"
          />
        </div>
        <div class="contato__formulario">
          <h1 id="contato-titulo" class="sr-only">Fale Conosco Ford Ranger 2022</h1>
          <h2>Fale Conosco</h2>
          <form id="form-contato">
            <div class="contato__campo">
              <label for="nome">Nome*</label>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required
              />
            </div>
            <div class="contato__campo">
              <label for="email">E-mail*</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="@gmail, @outlook ou @hotmail"
                required
              />
            </div>
            <div class="contato__campo">
              <label for="telefone">Telefone</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Digite seu telefone com DDD"
              />
            </div>
            <div class="contato__campo">
              <label for="tipo-contato">Tipo do contato*</label>
              <select id="tipo-contato" name="tipo-contato" required>
                <option value="" disabled selected>Tipo do contato</option>
                <option>Elogio</option>
                <option>Reclamação</option>
                <option>Solicitação</option>
              </select>
            </div>
            <div class="contato__campo">
              <label for="mensagem-texto">Mensagem*</label>
              <textarea
                id="mensagem-texto"
                name="mensagem-texto"
                rows="6"
                placeholder="Mensagem"
                required
              ></textarea>
            </div>
            <button type="submit">Enviar</button>
            <p
              id="mensagem"
              class="mensagem"
              role="status"
              aria-live="polite"
            ></p>
          </form>
        </div>
      </section>
    </main>
    <footer class="rodape">
      <!-- Nova div agrupando o texto e as redes sociais para ocupar a 1ª coluna do Grid -->
      <div class="rodape__agrupamento-social">
        <p class="rodape__texto">Redes Sociais:</p>
        <div class="rodape__links">
          <a
            class="rodape__links__logo"
            target="_blank"
            rel="noopener noreferrer"
            href="https://www.instagram.com/fordbrasil/"
          >
            <img
              src="img/instagram-logo-50.png"
              alt="Instagram"
              loading="lazy"
            />
          </a>
          <a
            class="rodape__links__logo"
            target="_blank"
            rel="noopener noreferrer"
            href="https://www.youtube.com/fordbrasil"
          >
            <img
              src="img/youtube-squared-50.png"
              alt="YouTube"
              loading="lazy"
            />
          </a>
          <a
            class="rodape__links__logo"
            target="_blank"
            rel="noopener noreferrer"
            href="https://www.facebook.com/FordBrasil/?locale=pt_BR"
          >
            <img
              src="img/facebook-50.png"
              alt="Facebook"
              loading="lazy"
            />
          </a>
        </div>
      </div>
      <!-- 2ª Coluna -->
      <p class="rodape__copy">
        Copyright &copy; 2026 Ford Motor Company - Todos os direitos reservados
      </p>
      <!-- 3ª Coluna -->
      <img
        class="rodape__ford__logo"
        src="img/ford-96.png"
        alt="Logo Ford"
        loading="lazy"
      />
    </footer>
  </body>
</html>
