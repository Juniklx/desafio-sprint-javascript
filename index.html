<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Novo lançamento: Ford Ranger 2022</title>
        <meta
            name="description"
            content="Conheça a nova Ford Ranger 2022: motores turbo diesel, tração 4x4 e alta conectividade com a central SYNC e o FordPass Connect."
        />
        <link rel="icon" type="image/png" href="img/ford-logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        />
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/style.css" />
        <script src="js/carousel.js"></script>
    </head>
    <body>
        <header class="header">
            <a href="index.html" class="header__logo">
                <img
                    src="img/logo-ford-256.png"
                    class="header__logo-image"
                    alt="Ford"
                />
            </a>
            <input type="checkbox" id="menu-hamburguer" />
            <label for="menu-hamburguer" class="header__nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="header__nav" id="menu-navegacao">
                <a
                    href="index.html"
                    class="header__nav-link"
                    aria-current="page"
                    >HOME</a
                >
                <a href="launch.html" class="header__nav-link"
                    >LANÇAMENTO</a
                >
                <a href="contact.html" class="header__nav-link">CONTATO</a>
            </nav>
        </header>
        <main class="page">
            <div class="carousel__viewport">
                <button class="carousel__button carousel__button--prev" onclick="Carousel.prev()" aria-label="Imagem anterior">&#10094;</button>
                <div id="carousel"></div>
                <button class="carousel__button carousel__button--next" onclick="Carousel.next()" aria-label="Próxima imagem">&#10095;</button>
            </div>
            <div id="carousel-title"></div>
            <script>
                carouselArr.push(
                    new Carousel(
                        "imagem_1.jpg",
                        "Esta é a nova Ranger Ford 2022. Equipada com motores turbo diesel, é reconhecida pela excelente capacidade off-road (imersão de até 800 mm), tração 4x4 com reduzida e alta conectividade através da central SYNC e do aplicativo FordPass Connect.",
                        "launch.html",
                    ),
                );
                carouselArr.push(
                    new Carousel(
                        "imagem_2.jpg",
                        "A Ford Motor Company foi fundada por Henry Ford em 16 de junho de 1903, em Detroit, Michigan. A marca mudou o mundo ao criar o Fordismo, sistema de produção em massa que popularizou o automóvel com o icônico Modelo T em 1908, e construiu uma longa história de mais de um século no Brasil",
                        "launch.html",
                    ),
                );
                carouselArr.push(
                    new Carousel(
                        "imagem_3.jpg",
                        "Nova Ford Bronco Sport 2022. Um SUV médio com forte apelo off-road. Vendido na versão topo de linha Wildtrak, ele traz motor 2.0 EcoBoost turbo, tração 4x4 inteligente com seletores de terreno (G.O.A.T. Modes), câmbio automático de 8 marchas e lista robusta de itens de conforto e segurança.",
                        "launch.html",
                    ),
                );
                Carousel.start(carouselArr);
            </script>
        </main>
        <footer class="footer">

            <div class="footer__social">
                <p class="footer__text">Redes Sociais:</p>
                <div class="footer__links">
                    <a
                        class="footer__links-logo"
                        target="_blank"
                        rel="noopener noreferrer"
                        href="https://www.instagram.com/fordbrasil/"
                    >
                        <img
                            src="img/instagram-logo-50.png"
                            alt="Instagram"
                            loading="lazy"
                        />
                    </a>
                    <a
                        class="footer__links-logo"
                        target="_blank"
                        rel="noopener noreferrer"
                        href="https://www.youtube.com/fordbrasil"
                    >
                        <img
                            src="img/youtube-squared-50.png"
                            alt="YouTube"
                            loading="lazy"
                        />
                    </a>
                    <a
                        class="footer__links-logo"
                        target="_blank"
                        rel="noopener noreferrer"
                        href="https://www.facebook.com/FordBrasil/?locale=pt_BR"
                    >
                        <img
                            src="img/facebook-50.png"
                            alt="Facebook"
                            loading="lazy"
                        />
                    </a>
                </div>
            </div>
            <p class="footer__copyright">
                Copyright &copy; 2026 Ford Motor Company - Todos os direitos
                reservados
            </p>
            <img
                class="footer__logo"
                src="img/ford-96.png"
                alt="Logo Ford"
                loading="lazy"
            />
        </footer>
    </body>
</html>
